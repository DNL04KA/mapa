<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>MAPA — фильм</title>
<!--
  Вторая версия ролика: «Карта, которая заполняется».

  Мир в MAPA — квадрат 1×1 (MapProjection.swift). Ролик открывается этим
  квадратом, лежащим в светлом пространстве; камера ныряет в него, пока
  страны загораются одна за другой, и квадрат становится экраном приложения.
  Дальше — одно касание, процент, карточка страны, статистика по
  континентам и знак.

  Геометрия, площади, цвета статусов и пружины — те же, что в приложении.
  Каждый кадр — функция времени render(t); тайминги в timeline.js общие
  с звуком (sound.py).
-->
<style>
  :root {
    --paper:      #FBFAF7;
    --paper-deep: #F2F0EB;
    --paper-sunk: #E9E7E1;
    --ink:        #141A21;
    --ink-mid:    #5A6470;
    --ink-low:    #8B949F;
    --accent:     #2E4A6B;
    --accent-soft:#9B8CFF;
    --brand:      #6C5CFF;

    --font-text: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Inter", system-ui, sans-serif;
    --font-display: -apple-system, BlinkMacSystemFont, "SF Pro Display", "Inter Display", "Inter", system-ui, sans-serif;
  }

  * { box-sizing: border-box; }

  html, body {
    margin: 0; height: 100%;
    background: #0E0F12; color: #E9E7E1;
    font-family: var(--font-text);
    -webkit-font-smoothing: antialiased;
  }
  body { display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 18px; overflow: hidden; }

  #viewport { position: relative; }

  #frame {
    position: absolute; left: 0; top: 0;
    width: 360px; height: 640px;
    overflow: hidden;
    background: var(--paper);
    transform-origin: 0 0;
    color: var(--ink);
    user-select: none;
  }

  .abs { position: absolute; }
  .layer { position: absolute; left: 0; top: 0; width: 360px; height: 640px; }
  svg.icon { display: block; overflow: visible; }

  /* Светлое пространство крючка: мягкий свет сверху слева. */
  #space {
    background:
      radial-gradient(120% 80% at 28% 18%, #FFFFFF 0%, rgba(255,255,255,0) 60%),
      linear-gradient(180deg, #FBFAF7 0%, #F2F0EB 100%);
  }

  #map { transform-origin: 50% 50%; }
  #screen { transform-origin: 0 0; }

  .map-text { text-shadow: 0 1px 6px rgba(255,255,255,0.9), 0 1px 2px rgba(255,255,255,0.585); }

  /* MARK: Шапка статистики (WorldStatsPanel) */

  #scrim {
    left: 0; top: 0; width: 360px; height: 230px;
    background: linear-gradient(180deg, rgba(255,255,255,0.99) 0%, rgba(255,255,255,0.92) 50%, rgba(255,255,255,0) 100%);
  }
  #scrim::before { content: ""; position: absolute; left: -200px; right: -200px; top: -400px; height: 400px; background: rgba(255,255,255,0.99); }

  #header { left: 20px; top: 34px; width: 320px; transform-origin: 0 0; }
  #header .overline { font-size: 10px; font-weight: 600; letter-spacing: 2.2px; text-transform: uppercase; color: rgba(20,26,33,0.45); }
  #header .row { display: flex; align-items: baseline; gap: 3px; margin-top: -2px; }
  #number { font-family: var(--font-display); font-size: 62px; font-weight: 300; letter-spacing: -1.5px; line-height: 1; font-variant-numeric: tabular-nums; color: var(--ink); }
  #header .percent { font-size: 20px; font-weight: 400; color: rgba(20,26,33,0.35); }
  #header .chevron { position: absolute; right: 0; top: 52px; color: rgba(20,26,33,0.7); }
  #counts { margin-top: 4px; font-size: 13px; font-weight: 500; color: rgba(20,26,33,0.65); font-variant-numeric: tabular-nums; }

  /* Развёрнутая таблица: подложка — условие читаемости поверх карты. */
  #panel {
    left: 20px; top: 146px; width: 320px;
    padding: 12px;
    border-radius: 18px;
    background: rgba(251,250,247,0.94);
    box-shadow: inset 0 0 0 1px rgba(20,26,33,0.10), 0 10px 26px rgba(0,0,0,0.12);
    transform-origin: 50% 0;
  }
  #panel .legend { display: flex; gap: 16px; height: 22px; align-items: center; }
  #panel .legend .item { display: flex; align-items: center; gap: 4px; }
  #panel .legend .dot { width: 8px; height: 8px; border-radius: 4px; }
  #panel .legend .count { font-size: 16px; font-weight: 600; font-variant-numeric: tabular-nums; }
  #panel .legend .title { font-size: 11px; font-weight: 600; color: rgba(20,26,33,0.5); }
  #panel .divider { height: 1px; margin: 8px 0; background: rgba(20,26,33,0.14); }
  #panel .rows { display: flex; flex-direction: column; gap: 8px; }
  #panel .prow { display: flex; align-items: center; gap: 12px; height: 22px; }
  #panel .prow .name { width: 118px; font-size: 13px; font-weight: 500; white-space: nowrap; }
  #panel .prow .track { position: relative; flex: 1; height: 6px; border-radius: 3px; background: rgba(20,26,33,0.16); }
  #panel .prow .fill { position: absolute; left: 0; top: 0; height: 6px; border-radius: 3px; background: var(--accent); }
  #panel .prow .value { width: 42px; text-align: right; font-size: 11px; font-weight: 600; color: rgba(20,26,33,0.5); font-variant-numeric: tabular-nums; }

  /* MARK: Кнопки карты и нижняя панель */

  #controls { left: 300px; top: 214px; width: 44px; }
  #controls .button { width: 44px; height: 44px; margin-bottom: 4px; display: flex; align-items: center; justify-content: center; color: rgba(20,26,33,0.72); filter: drop-shadow(0 1px 3px rgba(255,255,255,0.9)); }

  #tabbar {
    left: 16px; top: 570px; width: 328px; height: 54px; padding: 6px 4px;
    display: flex; border-radius: 27px;
    background: rgba(255,255,255,0.88);
    box-shadow: inset 0 0 0 1px rgba(20,26,33,0.10), 0 10px 26px rgba(0,0,0,0.10);
  }
  #tabbar .item { flex: 1; height: 42px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px; color: rgba(20,26,33,0.68); font-size: 10px; font-weight: 500; }

  #home { width: 120px; margin-left: -60px; text-align: center; }
  #home .glyph { display: flex; justify-content: center; color: var(--ink); }
  #home .label { margin-top: 2px; font-size: 11px; font-weight: 600; color: var(--ink); }

  /* MARK: Панель статуса */

  #sheetScrim { background: rgba(0,0,0,0.18); }
  #sheet {
    left: 0; top: 0; width: 360px; padding: 12px 20px 32px;
    border-radius: 34px 34px 0 0;
    background: rgba(250,250,249,0.82);
    backdrop-filter: blur(24px) saturate(1.6); -webkit-backdrop-filter: blur(24px) saturate(1.6);
    box-shadow: inset 0 1px 0 rgba(255,255,255,0.7), 0 -12px 40px rgba(0,0,0,0.12);
    display: flex; flex-direction: column; align-items: center; gap: 24px;
  }
  #sheet .handle { width: 38px; height: 4px; border-radius: 2px; background: rgba(0,0,0,0.22); }
  #sheet .head { text-align: center; }
  #sheet .title { font-size: 26px; font-weight: 700; line-height: 1.15; }
  #sheet .subtitle { margin-top: 4px; font-size: 13px; font-weight: 500; color: var(--ink-low); }
  #sheet .details { height: 32px; margin: -12px 0; display: flex; align-items: center; gap: 4px; font-size: 14px; color: var(--accent-soft); }
  .options { display: flex; gap: 8px; width: 100%; }
  .option {
    position: relative; flex: 1; height: 96px; border-radius: 18px;
    display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 8px;
    font-size: 16px; font-weight: 600; color: var(--ink);
    background: rgba(255,255,255,0.62);
    box-shadow: inset 0 0 0 1px rgba(0,0,0,0.12), 0 4px 14px rgba(0,0,0,0.10);
  }
  .option .glyph { color: var(--ink-mid); display: flex; }
  .option .selected {
    position: absolute; inset: 0; border-radius: 18px;
    display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 8px;
    color: #FFFFFF; box-shadow: inset 0 0 0 1px rgba(255,255,255,0.35); opacity: 0;
  }
  .option .selected .glyph { color: #FFFFFF; }
  #sheet .homeButton {
    width: 100%; height: 44px; border-radius: 22px;
    display: flex; align-items: center; justify-content: center; gap: 8px;
    font-size: 16px; font-weight: 600;
    background: rgba(255,255,255,0.62); box-shadow: inset 0 0 0 1px rgba(0,0,0,0.12);
  }

  /* MARK: Карточка страны */

  #cardBg { background: var(--paper); }
  #cardContent { left: 20px; top: 344px; width: 320px; }
  #cardContent .title { font-family: var(--font-display); font-size: 40px; font-weight: 700; line-height: 1.12; letter-spacing: -0.4px; }
  #cardContent .subtitle { margin-top: 8px; font-size: 14px; color: var(--ink-mid); }
  #cardContent .overline { margin-top: 32px; margin-bottom: 12px; font-size: 11px; font-weight: 600; letter-spacing: 1.4px; text-transform: uppercase; color: var(--ink-low); }

  /* MARK: Касание, надпись, фирменный экран */

  #touch {
    width: 42px; height: 42px; margin: -21px 0 0 -21px; border-radius: 21px;
    background: rgba(20,26,33,0.16);
    box-shadow: inset 0 0 0 1.5px rgba(255,255,255,0.75), 0 2px 10px rgba(0,0,0,0.10);
  }

  .caption { font-family: var(--font-display); font-size: 31px; font-weight: 600; line-height: 1.08; letter-spacing: -0.7px; color: var(--ink); }
  .caption .line { display: block; }
  #caption1 { left: 20px; top: 470px; width: 320px; }

  #brand {
    background:
      radial-gradient(90% 60% at 50% 30%, #FFFFFF 0%, rgba(255,255,255,0) 70%),
      linear-gradient(180deg, #FBFAF7 0%, #F2F0EB 100%);
  }
  #brandWrap { filter: drop-shadow(0 0 22px rgba(20, 26, 33, 0.16)); }
  #brandMark { left: 108px; top: 176px; width: 144px; height: 144px; filter: drop-shadow(0 16px 26px rgba(76, 59, 216, 0.22)); }
  #brandWord { left: 0; top: 356px; width: 360px; display: flex; justify-content: center; }
  #brandPhrase {
    left: 0; top: 436px; width: 360px; text-align: center;
    font-family: var(--font-display); font-size: 21px; font-weight: 500; letter-spacing: -0.3px;
    color: var(--ink-mid);
  }

  /* MARK: Плеер — вне кадра */

  #player { display: flex; align-items: center; gap: 14px; font-size: 13px; color: #A7ADC4; }
  #player button { font: inherit; font-weight: 600; color: #F4F5FA; background: #1F2436; border: 1px solid rgba(255,255,255,0.12); border-radius: 999px; padding: 9px 16px; cursor: pointer; }
  #player button:hover { background: #2A3048; }
  #player input[type=range] { width: 200px; accent-color: #9B8CFF; }
  #player .time { width: 76px; font-variant-numeric: tabular-nums; }

  body.export { background: transparent; display: block; }
  body.export #player { display: none; }
</style>
</head>
<body>

  <div id="frame">
    <div id="space" class="layer"></div>
    <canvas id="map" class="layer"></canvas>

    <div id="screen" class="layer">

          <div class="glyph" data-icon="houseFill" data-size="22"></div>
          <div class="label">Варшава</div>
        </div>

        <div id="header" class="abs map-text">
          <div class="overline">Мир открыт на</div>
          <div class="row"><span id="number">0.0</span><span class="percent">%</span></div>
          <div id="counts"></div>
          <div class="chevron" data-icon="chevronDown" data-size="12"></div>
        </div>
        <div id="panel" class="abs">
          <div class="legend" id="legend"></div>
          <div class="divider"></div>
          <div class="rows" id="worldRow"></div>
          <div class="divider"></div>
          <div class="rows" id="continentRows"></div>
        </div>
        <div id="controls" class="abs">
          <div class="button" data-icon="magnifyingglass" data-size="16"></div>
          <div class="button" data-icon="locationFill" data-size="16"></div>
          <div class="button" data-icon="speedometer" data-size="16"></div>
          <div class="button" data-icon="plus" data-size="16"></div>
          <div class="button" data-icon="minus" data-size="16"></div>
          <div class="button" data-icon="globe" data-size="16"></div>
        </div>
        <div id="tabbar" class="abs">
          <div class="item"><span data-icon="person" data-size="16"></span>Профиль</div>
          <div class="item"><span data-icon="route" data-size="16"></span>Маршруты</div>
          <div class="item"><span data-icon="share" data-size="16"></span>Поделиться</div>
          <div class="item"><span data-icon="palette" data-size="16"></span>Оформление</div>
        </div>
      </div>

      <div id="sheetScrim" class="layer"></div>
      <div id="sheet" class="abs">
        <div class="handle"></div>
        <div class="head">
          <div class="title" data-text="countryName"></div>
          <div class="subtitle" data-text="sheetSubtitle"></div>
        </div>
        <div class="details">Подробнее о стране <span data-icon="chevronRight" data-size="12"></span></div>
        <div class="options" data-options="sheet"></div>
        <div class="homeButton"><span data-icon="house" data-size="16"></span>Сделать домом</div>
      </div>

      <div id="card" class="layer">
        <div id="cardBg" class="layer"></div>
        <div id="cardTint" class="layer"></div>
        <div id="cardContent" class="abs">
          <div class="title reveal" data-text="countryName"></div>
          <div class="subtitle reveal" data-text="cardSubtitle"></div>
          <div class="overline reveal">Твоя отметка</div>
          <div class="options reveal" data-options="card"></div>
        </div>
      </div>
    </div>

    <canvas id="fx" class="layer"></canvas>
    <div id="touch" class="abs"></div>

    <div id="caption1" class="abs caption">
      <span class="line">Считается площадь,</span>
      <span class="line">а не галочки.</span>
    </div>

    <!-- Тень на обёртке, а не на самом слое: у обрезанного кругом
         элемента своя тень обрезалась бы вместе с ним. -->
    <div id="brandWrap" class="layer">
      <div id="brand" class="layer">
        <div id="brandMark" class="abs"></div>
        <div id="brandWord" class="abs"></div>
        <div id="brandPhrase" class="abs">Сколько мира ты уже видел?</div>
      </div>
    </div>
  </div>
</div>

  <button id="toggle" type="button">Пауза</button>
  <input id="scrub" type="range" min="0" max="20" step="0.01" value="0" aria-label="Время">
  <span class="time" id="time">0.0 / 20.0 с</span>
  <button id="replay" type="button">Смотреть ещё раз</button>
</div>

<script src="../world.js"></script>
<script src="../brand/mark.js"></script>

<script>
"use strict";

const TL = window.MAPA_TIMELINE;
const W = 360, H = 640, DPR = 3;
const DURATION = TL.duration;

// MARK: - Знаки (по сетке SF Symbols)

const ICONS = {
    magnifyingglass: '<circle cx="10.5" cy="10.5" r="6.5" fill="none" stroke="currentColor" stroke-width="2.1"/><path d="M15.4 15.4 L20.5 20.5" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"/>',

    speedometer: '<path d="M4 17.5 A8.6 8.6 0 1 1 20 17.5" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/><path d="M12 15 L16 9" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"/><circle cx="12" cy="15" r="1.9" fill="currentColor"/><path d="M6.6 9.8 L7.6 10.6 M12 6.1 L12 7.4 M17.4 9.8 L16.4 10.6" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/>',

    palette: '<path d="M12 3.4 C6.6 3.4 3.2 7.2 3.2 11.8 C3.2 16.8 7.2 20.6 12.2 20.6 C13.6 20.6 14.2 19.8 13.8 18.6 C13.2 17 14 15.8 15.6 15.8 H17.6 C19.6 15.8 20.8 14.4 20.8 12.4 C20.8 7.2 17 3.4 12 3.4 Z" fill="none" stroke="currentColor" stroke-width="1.7"/><circle cx="7.6" cy="11.6" r="1.4" fill="currentColor"/><circle cx="9.6" cy="7.6" r="1.4" fill="currentColor"/><circle cx="14.2" cy="7.2" r="1.4" fill="currentColor"/><circle cx="17.2" cy="10.6" r="1.4" fill="currentColor"/>',
    chevronDown: '<path d="M5 9 L12 16 L19 9" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>',

    houseFill: '<path d="M12 3.2 L2.6 11.2 Q2.2 11.8 2.9 12 H5.2 V19.6 Q5.2 20.6 6.2 20.6 H9.8 V15.2 Q9.8 14.4 10.6 14.4 H13.4 Q14.2 14.4 14.2 15.2 V20.6 H17.8 Q18.8 20.6 18.8 19.6 V12 H21.1 Q21.8 11.8 21.4 11.2 Z" fill="currentColor"/>',

const icon = (name, size) => `<svg class="icon" width="${size}" height="${size}" viewBox="0 0 24 24">${ICONS[name]}</svg>`;

// MARK: - Цвета статусов (порт DS.StatusColor, включая светлое полотно)

function hsbToRgb(h, s, v) {
    const i = Math.floor(h * 6) % 6, f = h * 6 - Math.floor(h * 6);
    const p = v * (1 - s), q = v * (1 - f * s), t = v * (1 - (1 - f) * s);
    const [r, g, b] = [[v, t, p], [q, v, p], [p, v, t], [p, q, v], [t, p, v], [v, p, q]][i];
    return [r * 255, g * 255, b * 255];
}

function hueFromHex(hex) {
    const n = parseInt(hex.replace("#", ""), 16);
    const r = ((n >> 16) & 255) / 255, g = ((n >> 8) & 255) / 255, b = (n & 255) / 255;
    const max = Math.max(r, g, b), min = Math.min(r, g, b), d = max - min;
    if (d <= 0.001) return null;
    let h = max === r ? ((g - b) / d) % 6 : max === g ? (b - r) / d + 2 : (r - g) / d + 4;
    h /= 6;
    return h < 0 ? h + 1 : h;
}

function fnv(id, seed) {
    let hash = seed;
    for (const byte of new TextEncoder().encode(id)) hash = ((hash ^ BigInt(byte)) * 0x100000001b3n) & 0xFFFFFFFFFFFFFFFFn;
    return hash;
}

const StatusColor = (() => {
    const target = { visited: [0.60, 0.36], living: [0.66, 0.32], wishlist: [0.34, 0.62] };
    const saturation = { visited: 0.78, living: 0.74, wishlist: 0.62 };
    const fallbackHue = { visited: 0.085, living: 0.475, wishlist: 0.755 };

    function luminanceOfHue(hue) {
        const sector = hue * 6, fraction = sector - Math.floor(sector);
        const rgb = [[1, fraction, 0], [1 - fraction, 1, 0], [0, 1, fraction], [0, 1 - fraction, 1], [fraction, 0, 1], [1, 0, 1 - fraction]][Math.floor(sector) % 6];
        return 0.2126 * rgb[0] + 0.7152 * rgb[1] + 0.0722 * rgb[2];
    }

    function balanced(hue, status, lift, onLight) {
        const hl = luminanceOfHue(hue);
        const goal = Math.min(0.92, Math.max(0.12, target[status][onLight ? 1 : 0] + lift));
        let s = Math.min(1, saturation[status] + (onLight ? 0.03 : 0));
        let b = 1;
        const natural = b * (1 - s * (1 - hl));
        const corrected = natural + (goal - natural) * (onLight ? 0.5 : 0.55);
        if (corrected < natural) b = corrected / Math.max(0.05, 1 - s * (1 - hl));
        else if (hl < 0.999) s = Math.max(0.30, (1 - corrected) / (1 - hl));
        return hsbToRgb(hue, Math.min(Math.max(s, 0), 1), Math.min(Math.max(b, 0), 1));
    }

    return {
        colors(status, { flagHue = null, tint = 0, onLight = false } = {}) {
            const hue = flagHue ?? fallbackHue[status];
            const jitter = tint * 0.04;
            return [balanced(hue, status, 0.06 + jitter, onLight), balanced((hue + 0.035) % 1, status, -0.15 + jitter, onLight)];
        },
        glow(status) { return hsbToRgb(fallbackHue[status], 0.72, 1); },
        outline(status, flagHue = null) { return hsbToRgb(flagHue ?? fallbackHue[status], 0.22, 1); },
        // DS.StatusColor.tint(for:) — устойчивый разброс светлоты, −1…1.
        tint(id) { return Number(fnv(id, 0xcbf29ce484222325n) % 2001n) / 1000 - 1; }
    };
})();

const rgba = ([r, g, b], a = 1) => `rgba(${r.toFixed(1)}, ${g.toFixed(1)}, ${b.toFixed(1)}, ${a})`;
const mix = (a, b, p) => a.map((v, i) => v + (b[i] - v) * p);

// MARK: - Мир и отметки

const countries = window.MAPA_WORLD.countries;
const byID = Object.fromEntries(countries.map((c) => [c.id, c]));
const landPath = new Path2D();
for (const country of countries) {
    const path = new Path2D();
    for (const ring of country.rings) {
        path.moveTo(ring[0], ring[1]);
        for (let i = 2; i < ring.length; i += 2) path.lineTo(ring[i], ring[i + 1]);
        path.closePath();
    }
    country.path = path;
    country.anchor = [country.main[0] + country.main[2] / 2, country.main[1] + country.main[3] / 2];
    landPath.addPath(path);
}

function unitPoint(longitude, latitude) {
    const max = 85.05112877980659;
    const r = Math.min(Math.max(latitude, -max), max) * Math.PI / 180;
    return [(longitude + 180) / 360, 0.5 - Math.log(Math.tan(Math.PI / 4 + r / 2)) / (2 * Math.PI)];
}

// Дом в Польше и пятнадцать поездок — состояние со скриншота в README
// (2.5 %). Австралия отмечается в кадре.
const HOME = "POL";
const VISITED = ["DEU", "FRA", "ESP", "PRT", "ITA", "AUT", "CZE", "HUN", "NLD", "BEL", "CHE", "HRV", "GRC", "TUR", "GEO"];
const TARGET = "AUS";
const target = byID[TARGET];

// Порядок зажигания в крючке: сначала дом, дальше — по удалению от него.
const IGNITION = [HOME, ...VISITED.slice().sort((a, b) => {
    const d = (id) => Math.hypot(byID[id].anchor[0] - byID[HOME].anchor[0], byID[id].anchor[1] - byID[HOME].anchor[1]);
    return d(a) - d(b);
})];

// Палитра «Флаги» на полотне «Светлая»: обе бесплатные и выбираются
// независимо. Тон — от флага, светлота — от статуса, заливка плоская.
function fillColor(id) {
    const country = byID[id];
    const status = id === HOME ? "living" : "visited";
    return StatusColor.colors(status, { flagHue: hueFromHex(country.color), tint: StatusColor.tint(id), onLight: true })[0];
}

const totalArea = countries.reduce((sum, c) => sum + c.area, 0);
const CONTINENTS = ["Africa", "Asia", "Europe", "North America", "South America", "Oceania"];
const CONTINENT_RU = { "Africa": "Африка", "Asia": "Азия", "Europe": "Европа", "North America": "Северная Америка", "South America": "Южная Америка", "Oceania": "Океания", "Antarctica": "Антарктида" };

// Та же арифметика, что TravelStatistics.make: доля по площади, «хочу» не в счёт.
function statistics(explored) {
    const area = explored.reduce((sum, id) => sum + byID[id].area, 0);
    const continents = CONTINENTS.map((continent) => {
        const all = countries.filter((c) => c.continent === continent);
        const mine = all.filter((c) => explored.includes(c.id));
        return {
            continent, total: all.length, explored: mine.length,
            fraction: mine.reduce((s, c) => s + c.area, 0) / all.reduce((s, c) => s + c.area, 0)
        };
    });
    return {
        percent: area / totalArea * 100,
        count: explored.length,
        continents,
        touched: continents.filter((c) => c.explored > 0).length
    };
}

const before = statistics([HOME, ...VISITED]);
const after = statistics([HOME, ...VISITED, TARGET]);

function plural(n, one, few, many) {
    const m10 = n % 10, m100 = n % 100;
    if (m10 === 1 && m100 !== 11) return one;
    if (m10 >= 2 && m10 <= 4 && !(m100 >= 12 && m100 <= 14)) return few;
    return many;
}
const countsText = (s) => `${s.count} ${plural(s.count, "страна", "страны", "стран")} · ${s.touched} ${plural(s.touched, "континент", "континента", "континентов")}`;

const TEXT = {
    countryName: target.nameRU,
    sheetSubtitle: `${CONTINENT_RU[target.continent]} · ${areaText}`,
    cardSubtitle: `${CONTINENT_RU[target.continent]} · ${areaText} · ${target.name}`
};

const heroColors = StatusColor.colors("visited", { flagHue: targetFlagHue });
const visitedColors = StatusColor.colors("visited");

// MARK: - Движение (DS.Motion.Preset)

const SPRING = { snap: [0.26, 0.86], smooth: [0.45, 0.90], flow: [0.68, 0.88], bounce: [0.50, 0.62] };

function spring(t, [response, damping]) {
    if (t <= 0) return 0;
    const w0 = 2 * Math.PI / response, wd = w0 * Math.sqrt(1 - damping * damping);
    return 1 - Math.exp(-damping * w0 * t) * (Math.cos(wd * t) + (damping * w0 / wd) * Math.sin(wd * t));
}
const clamp = (v, a = 0, b = 1) => Math.min(Math.max(v, a), b);
const lerp = (a, b, p) => a + (b - a) * p;
const progress = (t, [start, end]) => clamp((t - start) / (end - start));
const easeInOut = (p) => p < 0.5 ? 4 * p * p * p : 1 - Math.pow(-2 * p + 2, 3) / 2;
const easeOut = (p) => 1 - Math.pow(1 - p, 3);

function bezier(x1, y1, x2, y2) {
    return (p) => {
        let lo = 0, hi = 1, s = p;
        for (let i = 0; i < 24; i++) {
            s = (lo + hi) / 2;
            const x = 3 * (1 - s) * (1 - s) * s * x1 + 3 * (1 - s) * s * s * x2 + s * s * s;
            if (x < p) lo = s; else hi = s;
        }
        return 3 * (1 - s) * (1 - s) * s * y1 + 3 * (1 - s) * s * s * y2 + s * s * s;
    };
}
const glide = bezier(0.65, 0, 0.2, 1);     // медленно трогается, долго тормозит
const rush = bezier(0.55, 0, 0.1, 1);      // нырок: разгон и мягкая посадка

// MARK: - Камеры

// Камера карты: центр в единичном квадрате, сторона мира в точках и
// экранный сдвиг (шит, крючок).
const CAM = {
    world0:  { cx: 0.5, cy: 0.5, side: 250, shift: 78 },
    europe:  { cx: 0.5455, cy: 0.3330, side: 2350 },
    oceania: { cx: target.anchor[0], cy: target.anchor[1] - 10 / 2000, side: 2000 },
    world:   { cx: 0.7000, cy: 0.3700, side: 660 }
};
const SHEET_SHIFT = Math.min(0, (H - 330 - 24) - 330);
const TAP_POINT = unitPoint(134.5, -24.5);

// Наезд в точку: экранное смещение цели тает линейно, масштаб растёт по
// логарифму — цель плывёт к центру и не «уезжает», пока камера летит.
function zoomInto(from, to, p, z) {
    const side = Math.exp(lerp(Math.log(from.side), Math.log(to.side), z));
    const dx0 = (to.cx - from.cx) * from.side;
    const dy0 = (to.cy - from.cy) * from.side - (from.shift || 0);
    const k = 1 - p;
    return { cx: to.cx - dx0 * k / side, cy: to.cy - dy0 * k / side, side, shift: 0 };
}

function mapCamera(t) {
    const sheet = SHEET_SHIFT * (spring(t - TL.sheetUp, SPRING.smooth) - spring(t - TL.apply, SPRING.smooth));
    if (t < TL.flight[0]) {
        const p = rush(progress(t, TL.dive));
        return zoomInto(CAM.world0, CAM.europe, p, p);
    }
    if (t < TL.world[0]) {
        const p = glide(progress(t, TL.flight));
        const lift = Math.sin(Math.PI * p) * 1.05;
        return {
            cx: lerp(CAM.europe.cx, CAM.oceania.cx, p),
            cy: lerp(CAM.europe.cy, CAM.oceania.cy, p),
            side: Math.exp(lerp(Math.log(CAM.europe.side), Math.log(CAM.oceania.side), p) - lift),
            shift: sheet
        };
    }
    const p = glide(progress(t, TL.world));
    return {
        cx: lerp(CAM.oceania.cx, CAM.world.cx, p),
        cy: lerp(CAM.oceania.cy, CAM.world.cy, p),
        side: Math.exp(lerp(Math.log(CAM.oceania.side), Math.log(CAM.world.side), p)),
        shift: 0
    };
}

// Виртуальная камера экрана: наезд на число, на карточку и на таблицу.
const FOCUS = { header: { z: 2.2, cx: 96, cy: 82 }, panel: { z: 1.08, cx: 180, cy: 300 } };

function screenCamera(t) {
    const rest = { z: 1, cx: W / 2, cy: H / 2 };
    const towards = (focus, k) => ({
        z: Math.exp(lerp(0, Math.log(focus.z), k)),
        cx: lerp(rest.cx, focus.cx, k),
        cy: lerp(rest.cy, focus.cy, k)
    });
    if (t >= TL.push[0] && t < TL.pull[1]) {
        const k = glide(progress(t, TL.push)) * (1 - glide(progress(t, TL.pull)));
        return towards(FOCUS.header, k);
    }
    if (t >= TL.cardPush[0] && t < TL.drop[0] + 0.6) {
        const k = easeInOut(progress(t, TL.cardPush)) * (1 - easeInOut(progress(t, [TL.drop[0], TL.drop[0] + 0.6])));
        return { z: 1 + 0.05 * k, cx: W / 2, cy: lerp(H / 2, 300, k) };
    }
    if (t >= TL.statsPush[0]) {
        return towards(FOCUS.panel, glide(progress(t, TL.statsPush)));
    }
    return rest;
}

// Наклон квадрата мира в крючке: лист лежит в пространстве и выпрямляется,
// пока камера ныряет.
function tilt(t) {
    const k = 1 - easeInOut(progress(t, [TL.dive[0] + 0.1, TL.dive[1] - 0.15]));
    const impact = 1 + 0.12 * (1 - easeOut(clamp(t / 0.55)));
    return { rx: 46 * k, rz: -9 * k, scale: impact };
}

// MARK: - Отрисовка карты

const mapCanvas = document.getElementById("map");
const fxCanvas = document.getElementById("fx");
for (const canvas of [mapCanvas, fxCanvas]) { canvas.width = W * DPR; canvas.height = H * DPR; }
const mapContext = mapCanvas.getContext("2d");
const fxContext = fxCanvas.getContext("2d");

const grain = (() => {
    const size = 384, canvas = document.createElement("canvas");
    canvas.width = canvas.height = size;
    const context = canvas.getContext("2d"), image = context.createImageData(size, size);
    let seed = 20261024;
    const random = () => (seed = (seed * 1664525 + 1013904223) >>> 0) / 4294967296;
    for (let i = 0; i < image.data.length; i += 4) {
        const v = random() * 255;
        image.data[i] = image.data[i + 1] = image.data[i + 2] = v; image.data[i + 3] = 255;
    }
    context.putImageData(image, 0, 0);
    return canvas;
})();

function projector(map, screen) {
    const scale = map.side * screen.z;
    const ox = (W / 2 - map.cx * map.side - screen.cx) * screen.z + W / 2;
    const oy = (H / 2 - map.cy * map.side + (map.shift || 0) - screen.cy) * screen.z + H / 2;
    return {
        scale, ox, oy,
        point: (ux, uy) => [ux * scale + ox, uy * scale + oy],
        apply: (context) => context.setTransform(scale * DPR, 0, 0, scale * DPR, ox * DPR, oy * DPR)
    };
}

// Доля зажжённости страны в крючке, 0…1.
function ignition(t, index) {
    const start = TL.ignite.start + index * TL.ignite.step;
    return clamp((t - start) / 0.16);
}

function drawMap(t, state) {
    const context = mapContext;
    const view = state.projector;
    const px = 1 / view.scale;
    const z = state.screen.z;

    context.setTransform(1, 0, 0, 1, 0, 0);
    context.clearRect(0, 0, mapCanvas.width, mapCanvas.height);
    view.apply(context);

    // Лист мира: тень на «стол» видна, только пока видны края квадрата.
    context.save();
    context.shadowColor = "rgba(20, 26, 33, 0.22)";
    context.shadowBlur = 34 * z * DPR;
    context.shadowOffsetY = 16 * z * DPR;
    context.fillStyle = "#E6E5E1";
    context.fillRect(0, 0, 1, 1);
    context.restore();

    const ocean = context.createLinearGradient(0, 0, 0, 1);
    ocean.addColorStop(0, "#EFEEEB");
    ocean.addColorStop(1, "#E6E5E1");
    context.fillStyle = ocean;
    context.fillRect(0, 0, 1, 1);

    context.save();
    context.shadowColor = "rgba(0, 0, 0, 0.22)";
    context.shadowBlur = 7 * z * DPR;
    context.shadowOffsetY = 2.5 * z * DPR;
    context.fillStyle = "#FBFAF7";
    context.fill(landPath);
    context.restore();

    const land = context.createLinearGradient(0, 0, 0, 1);
    land.addColorStop(0, "#FBFAF7");
    land.addColorStop(1, "#F4F2ED");
    context.fillStyle = land;
    context.fill(landPath);

    context.strokeStyle = "rgba(167, 158, 146, 0.42)";
    context.lineWidth = 0.7 * px * z;
    context.lineJoin = "round";
    context.stroke(landPath);

    // Страны крючка: каждая загорается своим цветом с коротким «вдохом»
    // от центра — как краска, которая ложится и оседает.
    IGNITION.forEach((id, index) => {
        const k = ignition(t, index);
        if (k <= 0) return;
        const country = byID[id];
        const e = easeOut(k);
        const pop = 1 + 0.22 * (1 - e);
        context.save();
        context.translate(country.anchor[0], country.anchor[1]);
        context.scale(pop, pop);
        context.translate(-country.anchor[0], -country.anchor[1]);
        context.fillStyle = rgba(fillColor(id), 0.9 * e);
        context.fill(country.path);
        context.strokeStyle = `rgba(255, 255, 255, ${(0.85 * e).toFixed(3)})`;
        context.lineWidth = 1.1 * px * z / pop;
        context.stroke(country.path);
        context.restore();
    });

    // Австралия: растекание из точки касания, потом обычная заливка.
    if (state.targetFilled && state.targetAlpha > 0) {
        context.fillStyle = rgba(fillColor(TARGET), 0.9 * state.targetAlpha);
        context.fill(target.path);
        context.strokeStyle = `rgba(255, 255, 255, ${0.85 * state.targetAlpha})`;
        context.lineWidth = 1.1 * px * z;
        context.stroke(target.path);
    } else if (state.bloom > 0) {
        const [bx, by, bw, bh] = target.main;
        const [ox, oy] = TAP_POINT;
        const corners = [[bx, by], [bx + bw, by], [bx, by + bh], [bx + bw, by + bh]];
        const radius = Math.max(...corners.map(([x, y]) => Math.hypot(x - ox, y - oy))) * 1.15 * state.bloom;
        context.save();
        context.clip(target.path);
        context.beginPath();
        context.arc(ox, oy, Math.max(0, radius), 0, Math.PI * 2);
        context.fillStyle = rgba(fillColor(TARGET), 0.9);
        context.fill();
        context.strokeStyle = rgba(StatusColor.outline("visited", targetFlagHue), 0.75 * clamp(1 - state.bloom));
        context.lineWidth = 2.5 * px * z;
        context.stroke();
        context.restore();
    }

    if (state.highlight > 0) {
        context.save();
        context.shadowColor = `rgba(46, 74, 107, ${0.85 * state.highlight})`;
        context.shadowBlur = 14 * z * DPR;
        context.strokeStyle = `rgba(20, 26, 33, ${0.9 * state.highlight})`;
        context.lineWidth = 2 * px * z;
        context.stroke(target.path);
        context.restore();
    }

    // Зерно бумаги — только на самом листе.
    context.save();
    context.beginPath();
    context.rect(0, 0, 1, 1);
    context.clip();
    context.setTransform(1, 0, 0, 1, 0, 0);
    context.globalAlpha = 0.05;
    context.globalCompositeOperation = "soft-light";
    context.fillStyle = context.createPattern(grain, "repeat");
    context.fillRect(0, 0, mapCanvas.width, mapCanvas.height);
    context.restore();
}

// MARK: - Силуэт: с карты в обложку и обратно

const HERO_RECT = { x: 48, y: 32, w: 264, h: 256 };

function drawSilhouette(state) {
    const context = fxContext;
    context.setTransform(1, 0, 0, 1, 0, 0);
    context.clearRect(0, 0, fxCanvas.width, fxCanvas.height);
    if (state.lift <= 0) return;

    const [bx, by, bw, bh] = target.main;
    const centre = [bx + bw / 2, by + bh / 2];
    const [fromX, fromY] = state.projector.point(...centre);
    const heroScale = Math.min(HERO_RECT.w / bw, HERO_RECT.h / bh);
    const screen = state.screen;
    const heroX = (HERO_RECT.x + HERO_RECT.w / 2 - screen.cx) * screen.z + W / 2;
    const heroY = (HERO_RECT.y + HERO_RECT.h / 2 - screen.cy) * screen.z + H / 2;

    const p = state.lift;
    const scale = Math.exp(lerp(Math.log(state.projector.scale), Math.log(heroScale * screen.z), p));
    const cx = lerp(fromX, heroX, p);
    const cy = lerp(fromY, heroY, p) - Math.sin(Math.PI * p) * 18;

    context.setTransform(scale * DPR, 0, 0, scale * DPR, (cx - centre[0] * scale) * DPR, (cy - centre[1] * scale) * DPR);
    const k = easeInOut(clamp(p * 1.25));
    const base = fillColor(TARGET);
    const gradient = context.createLinearGradient(bx, by, bx + bw, by + bh);
    gradient.addColorStop(0, rgba(mix(base, heroColors[0], k)));
    gradient.addColorStop(1, rgba(mix(base, heroColors[1], k)));

    context.save();
    context.shadowColor = rgba(heroColors[0], 0.5 * k * state.heroGlow);
    context.shadowBlur = 60 * screen.z * DPR;
    context.fillStyle = gradient;
    context.fill(target.path);
    context.shadowColor = rgba(heroColors[0], 0.9 * k * state.heroGlow);
    context.shadowBlur = 30 * screen.z * DPR;
    context.fill(target.path);
    context.restore();

    context.strokeStyle = `rgba(255, 255, 255, ${lerp(0.85, 0.55, k)})`;
    context.lineWidth = lerp(1.1, 1.2, k) / scale * screen.z;
    context.lineJoin = "round";
    context.stroke(target.path);
}

// MARK: - Интерфейс

const $ = (selector) => document.querySelector(selector);

function buildInterface() {
    for (const node of document.querySelectorAll("[data-icon]")) node.insertAdjacentHTML("afterbegin", icon(node.dataset.icon, Number(node.dataset.size)));
    for (const node of document.querySelectorAll("[data-text]")) node.textContent = TEXT[node.dataset.text];

    const options = [["visited", "Был", "checkmarkCircleFill"], ["living", "Живу", "houseFill"], ["wishlist", "Хочу", "sparkles"]];
    for (const container of document.querySelectorAll("[data-options]")) {
        container.innerHTML = options.map(([status, title, glyph]) => `
            <div class="option" data-status="${status}">
                <span class="glyph">${icon(glyph, 28)}</span>${title}
                <div class="selected"><span class="glyph">${icon(glyph, 28)}</span>${title}</div>
            </div>`).join("");
    }
    for (const node of document.querySelectorAll('.option[data-status="visited"] .selected')) {
        node.style.background = `linear-gradient(135deg, ${rgba(visitedColors[0])}, ${rgba(visitedColors[1])})`;
        node.style.setProperty("--cut", rgba(visitedColors[0]));
    }
    $("#counts").textContent = countsText(after);
    $("#cardTint").style.background = `radial-gradient(circle 620px at 50% 0, ${rgba(heroColors[0], 0.5)}, ${rgba(heroColors[0], 0)})`;

    // Развёрнутая таблица — те же строки, что WorldStatsPanel.
    const legend = [["visited", "был", 16], ["living", "живу", 1], ["wishlist", "хочу", 0]];
    $("#legend").innerHTML = legend.map(([status, title, count]) => {
        const [a, b] = StatusColor.colors(status);
        return `<div class="item"><span class="dot" style="background:linear-gradient(135deg,${rgba(a)},${rgba(b)})"></span><span class="count">${count}</span><span class="title">${title}</span></div>`;
    }).join("");
    const row = (name, fraction, value, active) => `
        <div class="prow" data-fraction="${fraction}">
            <span class="name" style="color:${active ? "var(--ink)" : "var(--ink-low)"}">${name}</span>
            <span class="track"><span class="fill"></span></span>
            <span class="value">${value}</span>
        </div>`;
    $("#worldRow").innerHTML = row("Весь мир", after.percent / 100, after.percent.toFixed(1) + "%", true);
    $("#continentRows").innerHTML = after.continents
        .map((c) => row(CONTINENT_RU[c.continent], c.fraction, `${c.explored}/${c.total}`, c.explored > 0)).join("");
}

const ui = {
    screen: $("#screen"), home: $("#home"), header: $("#header"), number: $("#number"), counts: $("#counts"),
    chevron: $("#header .chevron"), scrim: $("#scrim"), panel: $("#panel"),
    controls: $("#controls"), tabbar: $("#tabbar"),
    sheet: $("#sheet"), sheetScrim: $("#sheetScrim"),
    card: $("#card"), cardTint: $("#cardTint"), cardContent: $("#cardContent"),
    touch: $("#touch"), caption1: $("#caption1"),
    brand: $("#brand"), brandMark: $("#brandMark"), brandWord: $("#brandWord"), brandPhrase: $("#brandPhrase")
};

function setOpacity(node, value) {
    node.style.opacity = clamp(value).toFixed(4);
    node.style.visibility = value <= 0.001 ? "hidden" : "visible";
}

const TOUCHES = [{ at: TL.tap, kind: "map" }, { at: TL.pick, kind: "pick" }, { at: TL.statsTap, kind: "header" }];
function touchState(t) {
    for (const touch of TOUCHES) {
        const local = t - touch.at + 0.16;
        if (local < 0 || local > 0.62) continue;
        const press = easeOut(clamp(local / 0.14));
        const release = easeOut(clamp((local - 0.3) / 0.32));
        return { touch, opacity: press * (1 - release), scale: lerp(1.25, 1, press) + release * 0.35 };
    }
    return null;
}

let sheetHeight = 368;
let wordmarkSvg = "";

function render(t) {
    t = clamp(t, 0, DURATION);

    const screen = screenCamera(t);
    const map = mapCamera(t);
    const view = projector(map, screen);

    // MARK: Состояние

    const bloom = spring(t - TL.apply, SPRING.bounce);
    const lift = t < TL.drop[0] ? easeInOut(progress(t, TL.lift)) : 1 - easeInOut(progress(t, TL.drop));
    const cardIn = t < TL.drop[0]
        ? easeInOut(progress(t, [TL.lift[0] + 0.15, TL.lift[1]]))
        : 1 - easeInOut(progress(t, [TL.drop[0], TL.drop[1] - 0.2]));
    const state = {
        screen, projector: view, bloom,
        targetFilled: t >= TL.apply + 0.8,
        targetAlpha: lift > 0 ? (lift >= 0.999 ? 0 : clamp(1 - lift * 4)) : 1,
        highlight: clamp(easeOut(progress(t, [TL.tap, TL.tap + 0.25])) - easeOut(progress(t, [TL.apply, TL.apply + 0.25]))),
        lift,
        heroGlow: t < TL.drop[0] ? 1 : clamp(1 - progress(t, [TL.drop[0], TL.drop[0] + 0.5]))
    };

    drawMap(t, state);
    drawSilhouette(state);

    const { rx, rz, scale } = tilt(t);
    mapCanvas.style.transform = rx > 0.01 || scale > 1.0001
        ? `perspective(1100px) rotateX(${rx.toFixed(3)}deg) rotateZ(${rz.toFixed(3)}deg) scale(${scale.toFixed(4)})`
        : "none";

    ui.screen.style.transform = `translate(${(W / 2 - screen.cx * screen.z).toFixed(3)}px, ${(H / 2 - screen.cy * screen.z).toFixed(3)}px) scale(${screen.z.toFixed(5)})`;

    // MARK: Шапка: от счётчика крючка к интерфейсу

    const dock = easeInOut(progress(t, TL.dock));
    const hookScale = lerp(1.42, 1, dock);
    ui.header.style.transform = `translate(0px, ${lerp(6, 0, dock).toFixed(3)}px) scale(${hookScale.toFixed(4)})`;
    const headerOut = easeInOut(progress(t, [TL.lift[0] - 0.25, TL.lift[0] + 0.2]));
    const headerBack = easeInOut(progress(t, [TL.drop[1] - 0.1, TL.drop[1] + 0.5]));
    setOpacity(ui.header, easeOut(clamp(t / 0.25)) * (1 - headerOut) + headerBack);
    setOpacity(ui.counts, dock);
    setOpacity(ui.chevron, dock);
    setOpacity(ui.scrim, dock);

    // Процент: в крючке копится по площадям загоревшихся стран,
    // после «Был» растёт пружиной, как AnimatedNumber.
    let value = 0;
    IGNITION.forEach((id, index) => { value += byID[id].area * easeOut(ignition(t, index)); });
    value = value / totalArea * 100;
    if (t >= TL.apply) value = lerp(before.percent, after.percent, spring(t - TL.apply, SPRING.flow));
    ui.number.textContent = value.toFixed(1);
    ui.counts.textContent = countsText(t >= TL.apply ? after : before);

    // Кнопки и панель приходят, когда лист становится экраном.
    const chromeIn = easeOut(progress(t, [TL.dock[0] + 0.1, TL.dock[1] + 0.05]));
    const chrome = chromeIn * (1 - easeInOut(progress(t, [TL.chromeOut, TL.chromeOut + 0.45])));
    setOpacity(ui.controls, chrome);
    setOpacity(ui.tabbar, chrome);
    ui.controls.style.transform = `translateX(${((1 - chromeIn) * 14).toFixed(3)}px)`;
    ui.tabbar.style.transform = `translateY(${((1 - chromeIn) * 22).toFixed(3)}px)`;

    const [hx, hy] = projector(map, { z: 1, cx: W / 2, cy: H / 2 }).point(...unitPoint(21.0122, 52.2297));
    ui.home.style.left = hx.toFixed(2) + "px";
    ui.home.style.top = (hy - 13).toFixed(2) + "px";
    setOpacity(ui.home, chromeIn * (1 - progress(t, [TL.flight[0], TL.flight[0] + 0.5])));
    const breathe = 0.5 - 0.5 * Math.cos(t / 1.4 * Math.PI);
    const glyph = ui.home.querySelector(".glyph");
    glyph.style.filter = `drop-shadow(0 1px 2.5px rgba(255,255,255,0.9)) drop-shadow(0 0 ${lerp(4, 12, breathe).toFixed(2)}px rgba(20,26,33,${lerp(0.25, 0.9, breathe).toFixed(3)}))`;
    glyph.style.opacity = lerp(0.78, 1, breathe).toFixed(3);

    // MARK: Шит статуса

    const sheetIn = spring(t - TL.sheetUp, SPRING.smooth) - spring(t - TL.apply, SPRING.smooth);
    sheetHeight = ui.sheet.offsetHeight || sheetHeight;
    const sheetY = H - sheetHeight * clamp(sheetIn, -0.2, 1.2);
    ui.sheet.style.transform = `translateY(${sheetY.toFixed(3)}px)`;
    setOpacity(ui.sheet, sheetIn > 0.002 ? 1 : 0);
    setOpacity(ui.sheetScrim, sheetIn);
    const picked = spring(t - TL.pick, SPRING.bounce);
    for (const option of ui.sheet.querySelectorAll('.option[data-status="visited"]')) {
        const on = clamp(spring(t - TL.pick, SPRING.smooth));
        option.querySelector(".selected").style.opacity = on.toFixed(4);
        option.style.transform = `scale(${(1 + 0.03 * picked).toFixed(4)})`;
        option.style.boxShadow = `0 8px 20px ${rgba(StatusColor.glow("visited"), 0.45 * on)}`;
    }

    // MARK: Карточка

    setOpacity(ui.card, cardIn);
    ui.cardContent.querySelectorAll(".reveal").forEach((row, index) => {
        const shown = clamp(spring(t - (TL.cardReveal + index * 0.07), SPRING.smooth));
        const hidden = easeInOut(progress(t, [TL.drop[0] - 0.05, TL.drop[0] + 0.3]));
        row.style.opacity = (shown * (1 - hidden)).toFixed(4);
        row.style.transform = `translateY(${((1 - shown) * 14).toFixed(3)}px)`;
    });
    for (const option of ui.cardContent.querySelectorAll('.option[data-status="visited"]')) {
        option.querySelector(".selected").style.opacity = "1";
        option.style.transform = "scale(1.03)";
        option.style.boxShadow = `0 8px 20px ${rgba(StatusColor.glow("visited"), 0.45)}`;
    }

    // MARK: Таблица по континентам

    const open = spring(t - (TL.statsTap + 0.05), SPRING.smooth);
    setOpacity(ui.panel, open);
    ui.panel.style.transform = `translateY(${((1 - clamp(open)) * -10).toFixed(3)}px) scale(${lerp(0.97, 1, clamp(open)).toFixed(4)})`;
    ui.chevron.style.transform = `rotate(${(180 * clamp(spring(t - TL.statsTap, SPRING.snap))).toFixed(2)}deg)`;
    ui.panel.querySelectorAll(".prow").forEach((row, index) => {
        const fraction = Number(row.dataset.fraction);
        const start = index === 6 ? TL.oceania : TL.bars.start + index * TL.bars.step;
        // Океания растёт дольше остальных: одна страна закрывает девять
        // десятых континента, и это должно читаться отдельным событием.
        const grow = index === 6 ? bezier(0.3, 0, 0.1, 1)(clamp((t - start) / 0.75)) : clamp(spring(t - start, SPRING.smooth));
        const width = fraction > 0 ? Math.max(6 / 222, fraction) * grow : 0;
        row.querySelector(".fill").style.width = (width * 100).toFixed(3) + "%";
        // Пока растёт Океания, остальные строки отходят на второй план —
        // это слой подачи, сами строки и их значения не меняются.
        const focus = easeInOut(progress(t, [TL.oceania - 0.1, TL.oceania + 0.35]));
        row.style.opacity = index === 6 ? "1" : lerp(1, 0.38, focus).toFixed(4);
    });

    // MARK: Касание

    const touch = touchState(t);
    if (touch) {
        let x, y;
        if (touch.touch.kind === "map") [x, y] = view.point(...TAP_POINT);
        else if (touch.touch.kind === "pick") {
            const option = ui.sheet.querySelector('.option[data-status="visited"]');
            x = 20 + option.offsetLeft + option.offsetWidth / 2;
            y = sheetY + option.offsetTop + option.offsetHeight / 2;
        } else { x = 120; y = 96; }
        ui.touch.style.left = x.toFixed(2) + "px";
        ui.touch.style.top = y.toFixed(2) + "px";
        ui.touch.style.transform = `scale(${touch.scale.toFixed(4)})`;
        setOpacity(ui.touch, touch.opacity);
    } else setOpacity(ui.touch, 0);

    // MARK: Надпись

    const lines = ui.caption1.querySelectorAll(".line");
    const out = easeInOut(progress(t, [TL.caption[1] - 0.35, TL.caption[1]]));
    lines.forEach((line, index) => {
        const shown = clamp(spring(t - (TL.caption[0] + index * 0.1), SPRING.smooth));
        line.style.opacity = (shown * (1 - out)).toFixed(4);
        line.style.transform = `translateY(${((1 - shown) * 16 - out * 6).toFixed(3)}px)`;
    });
    setOpacity(ui.caption1, t >= TL.caption[0] && t <= TL.caption[1] ? 1 : 0);

    // MARK: Знак
    //
    // Бумага растекается по экрану из конца полосы Океании — тем же жестом,
    // каким краска ложится на страну. Затем в тишине бумаги растекается знак.

    const wipe = easeInOut(progress(t, TL.wipe));
    if (wipe > 0) {
        const origin = oceaniaPoint(screen);
        ui.brand.style.clipPath = `circle(${(wipe * 760).toFixed(2)}px at ${origin[0].toFixed(2)}px ${origin[1].toFixed(2)}px)`;
        setOpacity(ui.brand, 1);
    } else setOpacity(ui.brand, 0);
    // Тень края нужна только пока шторка идёт; на готовом экране её нет.
    $("#brandWrap").style.filter = wipe > 0 && wipe < 1 ? "drop-shadow(0 0 22px rgba(20, 26, 33, 0.16))" : "none";

    // Первым на первой ноте выходит большой круг — сразу форма знака;
    // светлые круги расцветают внутри от точки касания.
    const markProgress = [0, 1, 2].map((order) => clamp(spring(t - (TL.mark.start + order * TL.mark.step), SPRING.bounce), 0, 1.2));
    ui.brandMark.innerHTML = window.MAPA_BRAND.bloom(144, markProgress);

    const draw = easeOut(progress(t, TL.wordmark));
    ui.brandWord.innerHTML = wordmarkFrame(draw);
    const phrase = clamp(spring(t - TL.phrase, SPRING.smooth));
    ui.brandPhrase.style.opacity = phrase.toFixed(4);
    ui.brandPhrase.style.transform = `translateY(${((1 - phrase) * 12).toFixed(3)}px)`;
}

// Конец полосы Океании в координатах кадра.
function oceaniaPoint(screen) {
    const row = ui.panel.querySelectorAll(".prow")[6];
    const track = row.querySelector(".track");
    const x = 20 + 12 + track.offsetLeft + track.offsetWidth * Number(row.dataset.fraction);
    const y = 146 + 12 + row.offsetTop + 11;
    return [(x - screen.cx) * screen.z + W / 2, (y - screen.cy) * screen.z + H / 2];
}

// Словесный знак прорисовывается штрихом по буквам.
function wordmarkFrame(draw) {
    const { parts, width } = window.MAPA_BRAND.wordmarkPaths();
    const height = 54;
    const paths = parts.map((p, index) => {
        const local = clamp(draw * 1.6 - index * 0.2);
        const e = easeOut(local);
        return `<path d="${p.d}" transform="translate(${p.x} 0)" pathLength="1" stroke-dasharray="1 1" stroke-dashoffset="${(1 - e).toFixed(4)}" opacity="${clamp(local * 4).toFixed(3)}"/>`;
    }).join("");
    return `<svg height="${height}" viewBox="-12 -12 ${width + 24} 124" style="width:${(height * (width + 24) / 124).toFixed(2)}px;overflow:visible">
        <g fill="none" stroke="${window.MAPA_BRAND.INDIGO}" stroke-width="22" stroke-linecap="round" stroke-linejoin="round">${paths}</g></svg>`;
}

// MARK: - Замер крупного плана

function measureFocus() {
    const frame = $("#frame").getBoundingClientRect();
    const scale = frame.width / W;
    const saved = ui.header.style.transform;
    ui.header.style.transform = "none";
    const textRect = (selector) => { const r = document.createRange(); r.selectNodeContents($(selector)); return r.getBoundingClientRect(); };
    const parts = ["#header .overline", "#header .row", "#counts"].map(textRect);
    const left = Math.min(...parts.map((r) => r.left)), right = Math.max(...parts.map((r) => r.right));
    const top = Math.min(...parts.map((r) => r.top)), bottom = Math.max(...parts.map((r) => r.bottom));
    const width = (right - left) / scale;
    FOCUS.header.z = Math.min(2.6, (W - 2 * 34) / width);
    FOCUS.header.cx = (left - frame.left) / scale + width / 2;
    FOCUS.header.cy = ((top + bottom) / 2 - frame.top) / scale;
    ui.header.style.transform = saved;
}

// MARK: - Проигрывание

const isExport = new URLSearchParams(location.search).has("export");
if (isExport) document.body.classList.add("export");

let playing = !isExport, startedAt = 0, position = 0;

function fit() {
    if (isExport) return;
    const scale = Math.min((innerHeight - 96) / H, (innerWidth - 32) / W);
    $("#viewport").style.width = W * scale + "px";
    $("#viewport").style.height = H * scale + "px";
    $("#frame").style.transform = `scale(${scale})`;
}
function updatePlayer() {
    $("#scrub").value = position;
    $("#time").textContent = `${position.toFixed(1)} / ${DURATION.toFixed(1)} с`;
    $("#toggle").textContent = playing ? "Пауза" : "Смотреть";
}
function tick(now) {
    if (playing) {
        position = Math.min(DURATION, (now - startedAt) / 1000);
        if (position >= DURATION) playing = false;
    }
    render(position);
    updatePlayer();
    requestAnimationFrame(tick);
}
function play(from) {
    position = from ?? (position >= DURATION ? 0 : position);
    startedAt = performance.now() - position * 1000;
    playing = true;
    const audio = $("#soundtrack");
    if (audio) { audio.currentTime = position; audio.play().catch(() => {}); }
}

async function boot() {
    buildInterface();
    await Promise.all(["300 62px", "400 20px", "500 13px", "600 31px", "700 40px", "500 21px", "600 16px"]
        .map((spec) => document.fonts.load(`${spec} "Inter Display"`).catch(() => null)));
    await document.fonts.ready;
    measureFocus();

    window.__promo = { duration: DURATION, seek(t) { position = t; render(t); return true; } };
    if (isExport) { render(0); window.__promoReady = true; return; }

    // Звук: если рядом лежит собранная дорожка, страница играет её в такт.
    const audio = document.createElement("audio");
    audio.id = "soundtrack";
    audio.src = "soundtrack.wav";
    audio.preload = "auto";
    document.body.appendChild(audio);

    fit();
    addEventListener("resize", fit);
    $("#toggle").addEventListener("click", () => {
        if (playing) { playing = false; audio.pause(); } else play();
    });
    $("#replay").addEventListener("click", () => play(0));
    $("#scrub").addEventListener("input", (event) => { playing = false; audio.pause(); position = Number(event.target.value); });
    addEventListener("keydown", (event) => {
        if (event.code === "Space") { event.preventDefault(); if (playing) { playing = false; audio.pause(); } else play(); }
        if (event.key === "r" || event.key === "к") play(0);
    });
    play(0);
    requestAnimationFrame(tick);
}

boot();
</script>
